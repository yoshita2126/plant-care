services:
  - type: web
    name: plant-care-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CLIENT_ORIGIN
        value: https://plant-care-client.onrender.com

  - type: web
    name: plant-care-client
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://${{plant-care-api.host}}/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
